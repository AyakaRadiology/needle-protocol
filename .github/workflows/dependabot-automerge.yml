# Mechanical auto-merge for Dependabot PRs. The implementation is shared
# across every repo in both owners and lives in one place:
# https://github.com/Lin214ia/workflows/blob/main/.github/workflows/dependabot-automerge.yml
# Only `runs-on` belongs to this repo. Change behaviour there, not here.
#
# Direction (Harry, 2026-09-28 chat): patch/minor/major Dependabot PRs all
# merge themselves once CI is green -- majors carry the same `dependabot-major`
# label for visibility, but are no longer held back for manual review. If CI
# goes red on an armed PR, the pr-repair timer on harry (infra
# hosts/harry/spine/bin/pr-repair.sh) repairs it like any other armed PR.
# This repo's own dependabot.yml already keeps majors out of its groups (and
# ignores a couple of specific majors entirely), so this workflow's own
# major-vs-minor/patch classification is a second, independent check on the
# same policy rather than the only one.
#
# `pull_request_target`, but this workflow (and the one it calls) never checks
# out or runs any PR code -- only trusted Dependabot metadata and `gh`.
#
# runs-on: GitHub-hosted ubuntu-latest, matching ci.yml -- this repository is
# PUBLIC, so hosted minutes are free here, and there is no self-hosted runner
# group for it.
name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-automerge:
    if: github.actor == 'dependabot[bot]'
    uses: Lin214ia/workflows/.github/workflows/dependabot-automerge.yml@99dfe7b57cff656c0ff42c69cbf5d4e06a2dd293 # v1.1.0
    with:
      runs-on: '"ubuntu-latest"'
      arm-majors: true
    secrets:
      # Merge identity: the App token that arms auto-merge so the merge fires push workflows
      # (post-merge CI, release-please). A Dependabot-triggered run only sees DEPENDABOT secrets.
      app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
      app-private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
