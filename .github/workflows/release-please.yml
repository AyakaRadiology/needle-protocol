name: release-please

# Release automation, mirroring the sibling repos needle-guide and
# needle-simulator.
#
# On every push to main, release-please maintains ONE open
# "chore(main): release X.Y.Z" PR carrying the version bumps and the generated
# CHANGELOG. Merging that PR is the single human action -- it tags the release,
# and the tag is what every consumer pins. Never auto-merge the release PR:
# choosing when to cut a release is the decision this mechanism exists to
# preserve.
#
# `release-type: node` because package.json is the version's home here (the
# TypeScript half is the package a bun git dep resolves). gen/py/pyproject.toml
# is kept in lock-step through `extra-files`; those two versions drifting apart
# is exactly what hand-tagging gets wrong.
#
# The tag is pushed with a GitHub App token, not GITHUB_TOKEN. That matters
# twice over: a tag created with GITHUB_TOKEN triggers no workflows (GitHub's
# loop prevention); and a PR branch pushed by GITHUB_TOKEN has its checks held
# in `action_required` until a maintainer clicks "Approve and run", which is
# friction on every single release.
#
# runs-on: GitHub-hosted ubuntu-latest, matching ci.yml. See that file for why
# the self-hosted runners are not an option on a public repository.

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        name: Maintain release PR
        runs-on: ubuntu-latest
        outputs:
            # `releases_created` is the top-level aggregate. The release package
            # is anchored at the repo root (path `.`), so its per-package
            # outputs are emitted UNPREFIXED -- `tag_name`, not `.--tag_name`.
            released: ${{ steps.rp.outputs.releases_created }}
            tag: ${{ steps.rp.outputs.tag_name }}
        steps:
            # Fail with a sentence a human can act on, rather than deep inside
            # the token action with "invalid app id".
            - name: Preflight — the release bot's credentials must exist
              env:
                  APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
                  PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  if [ -z "${APP_ID:-}" ] || [ -z "${PRIVATE_KEY:-}" ]; then
                    echo "::error::Missing repository secrets RELEASE_BOT_APP_ID and/or RELEASE_BOT_PRIVATE_KEY. Copy them from AyakaRadiology/needle-simulator, which uses the same GitHub App; the App must also be installed on this repository." >&2
                    exit 1
                  fi

            - uses: actions/create-github-app-token@v3
              id: app-token
              with:
                  app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
                  private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

            - uses: googleapis/release-please-action@v5
              id: rp
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

            # Fail loudly if a release was created but the tag output is empty:
            # that would mean the output key below is wrong, and consumers pin
            # this repository BY TAG, so a release with no tag is a release
            # nobody can depend on.
            - name: Guard — a created release must carry a tag
              if: steps.rp.outputs.releases_created == 'true' && steps.rp.outputs.tag_name == ''
              run: |
                  echo "::error::release-please created a release but tag_name is empty — check the output key." >&2
                  exit 1

            # ---------------------------------------------------------------
            # Keep uv.lock in step with the version bump.
            #
            # release-please rewrites `version` in package.json (release-type
            # node) and in gen/py/pyproject.toml (extra-files), but uv.lock
            # stamps the workspace member's version too and release-please has
            # no updater for it: its extra-files types all need either a
            # jsonpath into a named table or an `x-release-please-version`
            # annotation comment, and uv.lock has neither -- the version sits
            # inside an anonymous `[[package]]` entry, and `uv lock` strips
            # hand-added comments on the next regeneration. So the lock has to
            # be regenerated by uv itself and committed onto the release PR.
            #
            # Left undone, the lock keeps the PREVIOUS version after every
            # release and the next `uv sync` dumps an unrelated uv.lock diff
            # onto whatever branch is cut next.
            #
            # The branch is found by asking for the open release PR rather than
            # by reading release-please's own `pr` output, for two reasons and
            # the first is not optional:
            #
            #   * `fromJSON(steps.rp.outputs.pr)` is evaluated by the workflow
            #     parser even when the step carrying it is skipped, and
            #     `fromJSON('')` is a template error that fails the whole job.
            #     The `pr` output is empty on every push that merely
            #     force-pushes an update onto the existing release PR, which is
            #     most of them.
            #   * Those update-only pushes are exactly when the lock commit gets
            #     clobbered (release-please force-pushes with no manual-commit
            #     detection), so the refresh has to run then too.
            - name: Resolve the release PR head branch
              id: relpr
              uses: actions/github-script@v8
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const prs = await github.paginate(github.rest.pulls.list, {
                          ...context.repo,
                          state: 'open',
                          per_page: 100,
                      });
                      // release-please names its branch after the target branch.
                      const release = prs.find((pr) =>
                          pr.head.ref.startsWith('release-please--branches--main')
                      );
                      if (!release) {
                          core.info('No open release PR; nothing to refresh.');
                          core.setOutput('branch', '');
                          return;
                      }
                      core.info(`Release PR #${release.number} on ${release.head.ref}.`);
                      core.setOutput('branch', release.head.ref);

            - name: Check out the release PR branch
              if: steps.relpr.outputs.branch != ''
              uses: actions/checkout@v4
              with:
                  ref: ${{ steps.relpr.outputs.branch }}
                  # Push with the App token, the same identity that authored the
                  # PR, so the resulting `synchronize` event runs CI without an
                  # approval click.
                  token: ${{ steps.app-token.outputs.token }}

            - name: Install uv
              if: steps.relpr.outputs.branch != ''
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: 'uv.lock'

            - name: Refresh uv.lock for the bumped version
              if: steps.relpr.outputs.branch != ''
              env:
                  HEAD_BRANCH: ${{ steps.relpr.outputs.branch }}
              run: |
                  set -euo pipefail
                  uv lock
                  if git diff --quiet -- uv.lock; then
                    echo "uv.lock already matches the bumped version — nothing to push."
                    exit 0
                  fi
                  git config user.name "release-please-bot"
                  git config user.email "release-please-bot@users.noreply.github.com"
                  git add uv.lock
                  git commit -m "chore: sync uv.lock with the release version bump"
                  git push origin "HEAD:${HEAD_BRANCH}"
